[project]
name = "agent-harness"
version = "0.1.0"
description = "A small harness for Anthropic Messages API tool-calling experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.125.0",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
module-name = "harness"

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "scripts", "tests"]
